<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0e1b16; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 16px;
      color: #e8f2de; background: #0e1b16; font: 16px system-ui, sans-serif; text-align: center; }
    #loading[hidden] { display: none; }
    progress { width: 240px; accent-color: #84c45b; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0" aria-label="Zoo World habitat"></canvas>
  <div id="loading" role="status"><span>Loading Zoo World</span><progress max="1" value="0"></progress></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const loading = document.getElementById('loading');
    createUnityInstance(document.getElementById('unity-canvas'), {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    }, progress => loading.querySelector('progress').value = progress)
      .then(() => { loading.hidden = true; document.getElementById('unity-canvas').focus(); })
      .catch(error => { loading.textContent = 'Zoo World could not start. Please reload the page.'; console.error(error); });
  </script>
</body>
</html>
